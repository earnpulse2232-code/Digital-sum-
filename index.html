<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc">
    <title>Speed Building Test — Digital Sum</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --green: #10b981;
            --green-light: #ecfdf5;
            --red: #ef4444;
            --red-light: #fef2f2;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-main);
            color: var(--text-dark);
            min-height: 100dvh;
            font-size: 15px;
            line-height: 1.5;
            overflow-x: hidden;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
        }
        img {
            max-width: 100%;
            height: auto;
            vertical-align: middle;
        }
        .hidden { display: none !important; }

        /* MODE SELECTION SCREEN */
        .start-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .start-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 36px 28px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .brand-logo-img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin: 0 auto 16px;
            display: block;
            border-radius: 16px;
        }
        .start-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        .start-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }
        .mode-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 16px;
            background: #fff;
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            text-align: left;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }
        .mode-btn:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        .mode-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .mode-icon.quiz { background: #dbeafe; color: #2563eb; }
        .mode-icon.test { background: #d1fae5; color: #059669; }
        .mode-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 2px;
        }
        .mode-info-txt {
            font-size: 12px;
            color: var(--text-muted);
        }
        .mode-arrow {
            margin-left: auto;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* MAIN APP */
        .quiz-app {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .quiz-header {
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 18px;
        }
        .quiz-header-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .hdr-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .hdr-logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 8px;
        }
        .hdr-brand-title {
            font-weight: 700;
            font-size: 15px;
            color: var(--text-dark);
        }
        .hdr-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #fff;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            transition: all 0.15s;
        }
        .hdr-btn:hover { background: var(--bg-main); }
        .hdr-timer {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-family: monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
        }

        /* QUESTIONS CONTAINER */
        .quiz-main {
            flex: 1;
            overflow-y: auto;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 16px;
        }
        .q-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }
        .q-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .q-num-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .q-text {
            font-size: 16px;
            line-height: 1.6;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 22px;
        }
        .opts {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }
        .opt {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: #fff;
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .opt:hover:not(.locked) {
            border-color: var(--primary);
            background: #f8fafc;
        }
        .opt.selected {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .opt.correct {
            border-color: var(--green);
            background: var(--green-light);
        }
        .opt.wrong {
            border-color: var(--red);
            background: var(--red-light);
        }
        .opt.locked { cursor: default; }
        .opt-letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #fff;
            border: 1.5px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .opt.selected .opt-letter {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .opt.correct .opt-letter {
            background: var(--green);
            border-color: var(--green);
            color: #fff;
        }
        .opt.wrong .opt-letter {
            background: var(--red);
            border-color: var(--red);
            color: #fff;
        }
        .opt-text {
            flex: 1;
            font-size: 15px;
            font-weight: 600;
        }
        .opt-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .opt.correct .opt-tag { background: var(--green); color: #fff; }
        .opt.wrong .opt-tag { background: var(--red); color: #fff; }

        .sol-box {
            margin-top: 20px;
            padding: 16px;
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            border-radius: 12px;
        }
        .sol-head {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sol-content {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-dark);
        }

        /* BOTTOM NAV */
        .quiz-nav {
            flex-shrink: 0;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
            padding: 12px 18px;
        }
        .quiz-nav-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.15s ease;
        }
        .nav-btn.prev {
            background: #fff;
            border: 1px solid var(--border-color);
            color: var(--text-dark);
        }
        .nav-btn.prev:disabled { opacity: 0.4; cursor: not-allowed; }
        .nav-btn.submit {
            background: var(--green-light);
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .nav-btn.next {
            background: var(--primary);
            color: #ffffff;
        }
        .nav-btn.next:hover { background: var(--primary-hover); }

        /* PALETTE MODAL */
        .palette-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            display: none;
        }
        .palette-overlay.open { display: block; }
        .palette-drawer {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: min(340px, 85vw);
            background: #ffffff;
            z-index: 160;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            box-shadow: var(--shadow-lg);
        }
        .palette-drawer.open { transform: translateX(0); }
        .pal-head {
            padding: 18px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
            font-size: 17px;
        }
        .pal-grid {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            align-content: start;
        }
        .pal-btn {
            aspect-ratio: 1;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        .pal-btn:hover { transform: scale(1.05); }
        .pal-btn.answered { background: var(--green); color: #fff; border-color: var(--green); }
        .pal-btn.current { outline: 2px solid var(--primary); outline-offset: 2px; }

        /* SUBMIT MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 170;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 20px;
            padding: 28px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
        .modal-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 22px;
        }
        .modal-stat {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid var(--border-color);
        }
        .modal-stat-num { font-size: 24px; font-weight: 800; color: var(--text-dark); }
        .modal-stat-label { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 4px; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .modal-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }
        .modal-btn.confirm { background: var(--primary); color: #fff; }
        .modal-btn.cancel { background: #f1f5f9; color: var(--text-dark); }

        /* RESULTS SCREEN */
        .results-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            z-index: 180;
            display: none;
            overflow-y: auto;
            padding: 30px 16px 60px;
        }
        .results-screen.open { display: block; }
        .results-box {
            max-width: 600px;
            margin: 0 auto;
        }
        .res-hero { text-align: center; margin-bottom: 24px; }
        .res-hero h2 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
        .res-score-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #fff;
            border-radius: 20px;
            padding: 28px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
        }
        .res-score-val { font-size: 54px; font-weight: 800; line-height: 1; margin-bottom: 6px; }
        .res-score-val span { font-size: 22px; opacity: 0.6; }
        .res-score-lbl { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.8; }
        .res-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .res-item {
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .res-item-val { font-size: 22px; font-weight: 700; }
        .res-item-lbl { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 4px; }
        .res-actions { display: flex; flex-direction: column; gap: 10px; }
        .res-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }
        .res-btn.primary { background: var(--primary); color: #fff; }

        /* TOAST */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: #0f172a;
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 300;
            opacity: 0;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-lg);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- START / MODE SELECT -->
    <div class="start-screen" id="startScreen">
        <div class="start-card">
            <img src="logo.png" alt="Quiz Logo" class="brand-logo-img" onerror="this.style.display='none'">
            <h1 class="start-title">Digital Sum — Practice Test</h1>
            <p class="start-desc">Speed Building Test — Choose your mode to begin.</p>
            
            <button class="mode-btn" onclick="startApp('quiz')">
                <div class="mode-icon quiz"><i class="fas fa-bolt"></i></div>
                <div>
                    <div class="mode-name">Practice Mode</div>
                    <div class="mode-info-txt">Instant answer & detailed solution after each question.</div>
                </div>
                <i class="fas fa-arrow-right mode-arrow"></i>
            </button>

            <button class="mode-btn" onclick="startApp('test')">
                <div class="mode-icon test"><i class="fas fa-clock"></i></div>
                <div>
                    <div class="mode-name">Exam Mode</div>
                    <div class="mode-info-txt">Test environment. View complete result at the end.</div>
                </div>
                <i class="fas fa-arrow-right mode-arrow"></i>
            </button>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div class="quiz-app hidden" id="quizApp">
        <header class="quiz-header">
            <div class="quiz-header-inner">
                <button class="hdr-btn" onclick="openPalette()"><i class="fas fa-th-large"></i></button>
                <div class="hdr-brand">
                    <img src="logo.png" alt="Logo" class="hdr-logo-img" onerror="this.style.display='none'">
                    <span class="hdr-brand-title">Quantitative Aptitude</span>
                </div>
                <div class="hdr-timer">
                    <i class="fas fa-stopwatch"></i>
                    <span id="timerText">00:00</span>
                </div>
            </div>
        </header>

        <main class="quiz-main" id="quizMain"></main>

        <nav class="quiz-nav" id="quizNav">
            <div class="quiz-nav-inner">
                <button class="nav-btn prev" id="prevBtn" onclick="prevQuestion()">
                    <i class="fas fa-arrow-left"></i> Previous
                </button>
                <button class="nav-btn submit" onclick="openSubmitModal()">
                    <i class="fas fa-paper-plane"></i> Submit
                </button>
                <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()">
                    <span id="nextLabel">Next</span> <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </nav>
    </div>

    <!-- QUESTION PALETTE -->
    <div class="palette-overlay" id="paletteOverlay" onclick="closePalette()"></div>
    <aside class="palette-drawer" id="paletteDrawer">
        <div class="pal-head">
            <span>Questions</span>
            <button onclick="closePalette()"><i class="fas fa-times"></i></button>
        </div>
        <div class="pal-grid" id="paletteGrid"></div>
    </aside>

    <!-- SUBMIT CONFIRMATION MODAL -->
    <div class="modal-overlay" id="submitModal">
        <div class="modal-box">
            <h3 class="modal-title">Submit Test?</h3>
            <div class="modal-stats-grid">
                <div class="modal-stat">
                    <div class="modal-stat-num" id="modalAttempted" style="color:var(--green)">0</div>
                    <div class="modal-stat-label">Attempted</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-num" id="modalUnattempted" style="color:var(--text-muted)">0</div>
                    <div class="modal-stat-label">Unattempted</div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn confirm" onclick="confirmSubmit()">Yes, Finish Test</button>
                <button class="modal-btn cancel" onclick="closeSubmitModal()">Resume Test</button>
            </div>
        </div>
    </div>

    <!-- FINAL RESULTS SCREEN -->
    <div class="results-screen" id="resultsScreen">
        <div class="results-box" id="resultsInner"></div>
    </div>

    <div class="toast" id="toast"><i class="fas fa-check"></i><span id="toastText"></span></div>

    <script>
        const QUESTIONS = [
            {
                q: "Evaluate 76².",
                o: ["5766", "5776", "5786", "5796"],
                a: 1,
                s: "Digital sum (76) = 7 + 6 = 13 → 4<br>Therefore, digital sum (76²) = digital sum (4²) = digital sum (16) = 7<br><br>Digital sums of options:<br>5766 → 6<br>5776 → 7<br>5786 → 8<br>5796 → 9<br><br>Only option B (5776) has digital sum 7."
            },
            {
                q: "Find the value of 48² − 42².",
                o: ["520", "530", "540", "550"],
                a: 2,
                s: "DS(48) = 4 + 8 = 12 → 3<br>DS(42) = 4 + 2 = 6<br>Required DS = DS(3² − 6²) = DS(9 − 36) = DS(−27) = 9 (or 0)<br><br>Options DS:<br>520 → 7<br>530 → 8<br>540 → 9<br>550 → 1<br><br>Only option C (540) has digital sum 9."
            },
            {
                q: "Evaluate 12³.",
                o: ["1628", "1728", "1828", "1928"],
                a: 1,
                s: "DS(12) = 1 + 2 = 3<br>Therefore, DS(12³) = DS(3³) = DS(27) = 9<br><br>Options DS:<br>1628 → 8<br>1728 → 9<br>1828 → 1<br>1928 → 2<br><br>Only option B (1728) has digital sum 9."
            },
            {
                q: "Find the cube root of 4913.",
                o: ["16", "17", "18", "19"],
                a: 1,
                s: "Digital sum (4913) = 4 + 9 + 1 + 3 = 17 → 8<br>For cube root, (DS)³ must yield digital sum 8:<br>DS(16) = 7 → 7³ = 343 → 1<br>DS(17) = 8 → 8³ = 512 → 8<br>DS(18) = 9 → 9³ = 729 → 9<br>DS(19) = 1 → 1³ = 1 → 1<br><br>Only option B (17) satisfies the condition. ∛4913 = 17."
            },
            {
                q: "Find the value of √(1 + 20 × 21 × 22 × 23).",
                o: ["451", "461", "471", "481"],
                a: 1,
                s: "Digital sum (20 × 21 × 22 × 23) = DS(2 × 3 × 4 × 5) = DS(120) = 3<br>Therefore, DS(1 + 20 × 21 × 22 × 23) = 1 + 3 = 4<br>If square root is r, then DS(r²) must be 4:<br>DS(451) = 1 → 1² = 1<br>DS(461) = 2 → 2² = 4<br>DS(471) = 3 → 3² = 9<br>DS(481) = 4 → 4² = 16 → 7<br><br>Only option B (461) is correct."
            },
            {
                q: "If N = 6789² + 6789 + 6790, find √N.",
                o: ["6788", "6789", "6790", "6792"],
                a: 2,
                s: "DS(6789) = 6 + 7 + 8 + 9 = 30 → 3<br>DS(6790) = 4<br>DS(N) = DS(3² + 3 + 4) = DS(9 + 3 + 4) = DS(16) = 7<br>Squaring the correct option must give DS = 7:<br>DS(6788) = 2 → 2² = 4<br>DS(6789) = 3 → 3² = 9<br>DS(6790) = 4 → 4² = 16 → 7<br>DS(6792) = 6 → 6² = 36 → 9<br><br>Only option C (6790) is correct."
            },
            {
                q: "Find the value of 36³ − 26³.",
                o: ["29070", "29080", "29090", "29180"],
                a: 1,
                s: "DS(36) = 9<br>DS(26) = 8<br>Required DS = DS(9³ − 8³) = DS(729 − 512) = DS(217) = 10 → 1<br><br>Options DS:<br>29070 → 9<br>29080 → 1<br>29090 → 2<br>29180 → 2<br><br>Only option B (29080) has digital sum 1."
            },
            {
                q: "12.5% of 6400 + 15% of 1200 = 20% of x. Find x.",
                o: ["4700", "4800", "4900", "5000"],
                a: 2,
                s: "Multiplying by 1000:<br>125 × 6400 + 150 × 1200 = 200x<br>DS(LHS) = DS(8 × 1 + 6 × 3) = DS(8 + 18) = DS(26) = 8<br>Therefore, DS(200x) = 2 × DS(x) = 8 → DS(x) must be 4.<br><br>Options DS:<br>4700 → 2<br>4800 → 3<br>4900 → 4<br>5000 → 5<br><br>Only option C (4900) gives DS = 4."
            },
            {
                q: "Find the value of (1008)² − 1009 × 1007 + 1005 × 1002 − 1006 × 1001.",
                o: ["3", "4", "5", "6"],
                a: 2,
                s: "DS(1008) = 9; DS(1009) = 1; DS(1007) = 8<br>DS(1005) = 6; DS(1002) = 3; DS(1006) = 7; DS(1001) = 2<br><br>Part 1 DS = DS(9² − 1 × 8) = DS(81 − 8) = DS(73) = 1<br>Part 2 DS = DS(6 × 3 − 7 × 2) = DS(18 − 14) = 4<br>Total DS = 1 + 4 = 5.<br>Answer = 5 (Option C)."
            },
            {
                q: "If A = (1/0.8 + 1/0.08 + 1/0.008 + ...) up to 5 terms, find A.",
                o: ["13887.75", "13888.75", "13889.75", "13898.75"],
                a: 1,
                s: "For each denominator (0.8, 0.08, ...), digit sum is 8.<br>Since 1/8 gives DS of 8 (multiplying num & den by 8 gives 8/64 → 8/1 = 8), each term has DS = 8.<br>For 5 terms: DS(A) = DS(8 × 5) = DS(40) = 4.<br><br>Options DS:<br>13887.75 → 3<br>13888.75 → 4<br>13889.75 → 5<br>13898.75 → 5<br><br>Only Option B (13888.75) has digital sum 4."
            }
        ];

        const state = {
            current: 0,
            answers: new Array(QUESTIONS.length).fill(null),
            locked: new Array(QUESTIONS.length).fill(false),
            visited: new Array(QUESTIONS.length).fill(false),
            mode: 'test',
            startTime: null,
            timerInterval: null,
            elapsed: 0
        };

        function $(id) { return document.getElementById(id); }

        function toast(msg) {
            const t = $('toast');
            $('toastText').textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        }

        function startApp(mode) {
            state.mode = mode;
            $('startScreen').classList.add('hidden');
            $('quizApp').classList.remove('hidden');
            state.startTime = Date.now();
            state.visited[0] = true;
            state.timerInterval = setInterval(() => {
                state.elapsed = Math.floor((Date.now() - state.startTime) / 1000);
                $('timerText').textContent = formatTime(state.elapsed);
            }, 1000);
            renderQuestion();
            buildPalette();
        }

        function renderQuestion() {
            const i = state.current;
            const q = QUESTIONS[i];
            const isQuiz = state.mode === 'quiz';
            const locked = state.locked[i];
            const userAns = state.answers[i];

            let optsHtml = '';
            q.o.forEach((opt, idx) => {
                let cls = '';
                let tag = '';
                if (isQuiz && locked) {
                    if (idx === q.a) { cls = 'correct'; tag = '<span class="opt-tag">Correct</span>'; }
                    if (userAns === idx && idx !== q.a) { cls = 'wrong'; tag = '<span class="opt-tag">Your Ans</span>'; }
                } else if (userAns === idx) {
                    cls = 'selected';
                }
                optsHtml += `
                    <div class="opt ${cls} ${locked ? 'locked' : ''}" onclick="selectOption(${idx})">
                        <div class="opt-letter">${String.fromCharCode(65 + idx)}</div>
                        <div class="opt-text">${opt}</div>
                        ${tag}
                    </div>
                `;
            });

            let solHtml = '';
            if (isQuiz && locked) {
                solHtml = `
                    <div class="sol-box">
                        <div class="sol-head"><i class="fas fa-lightbulb"></i> Solution & Digital Sum Logic</div>
                        <div class="sol-content">${q.s}</div>
                    </div>
                `;
            }

            $('quizMain').innerHTML = `
                <div class="q-card">
                    <div class="q-top">
                        <div class="q-num-badge"><i class="fas fa-hashtag"></i> Question ${i + 1} of ${QUESTIONS.length}</div>
                    </div>
                    <div class="q-text">${q.q}</div>
                    <div class="opts">${optsHtml}</div>
                    ${solHtml}
                </div>
            `;

            $('prevBtn').disabled = i === 0;
            $('nextLabel').textContent = i === QUESTIONS.length - 1 ? 'Finish' : 'Next';
            updatePaletteGrid();
        }

        function selectOption(idx) {
            const i = state.current;
            if (state.mode === 'quiz' && state.locked[i]) return;

            state.answers[i] = idx;
            if (state.mode === 'quiz') {
                state.locked[i] = true;
                if (idx === QUESTIONS[i].a) toast('Correct! 🎉');
                else toast('Incorrect');
            }
            renderQuestion();
        }

        function prevQuestion() {
            if (state.current > 0) {
                state.current--;
                state.visited[state.current] = true;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (state.current < QUESTIONS.length - 1) {
                state.current++;
                state.visited[state.current] = true;
                renderQuestion();
            } else {
                openSubmitModal();
            }
        }

        function buildPalette() {
            const grid = $('paletteGrid');
            grid.innerHTML = '';
            QUESTIONS.forEach((_, i) => {
                const btn = document.createElement('button');
                btn.className = 'pal-btn';
                btn.id = 'pal-' + i;
                btn.textContent = i + 1;
                btn.onclick = () => {
                    state.current = i;
                    state.visited[i] = true;
                    closePalette();
                    renderQuestion();
                };
                grid.appendChild(btn);
            });
            updatePaletteGrid();
        }

        function updatePaletteGrid() {
            QUESTIONS.forEach((_, i) => {
                const btn = $('pal-' + i);
                if (!btn) return;
                btn.className = 'pal-btn';
                if (i === state.current) btn.classList.add('current');
                if (state.answers[i] !== null) btn.classList.add('answered');
            });
        }

        function openPalette() {
            $('paletteDrawer').classList.add('open');$('paletteOverlay').classList.add('open');
        }
        function closePalette() {
            $('paletteDrawer').classList.remove('open');$('paletteOverlay').classList.remove('open');
        }

        function openSubmitModal() {
            const ans = state.answers.filter(a => a !== null).length;
            $('modalAttempted').textContent = ans;
            $('modalUnattempted').textContent = QUESTIONS.length - ans;
            $('submitModal').classList.add('open');
        }
        function closeSubmitModal() {
            $('submitModal').classList.remove('open');
        }

        function confirmSubmit() {
            closeSubmitModal();
            if (state.timerInterval) clearInterval(state.timerInterval);

            let correct = 0, wrong = 0;
            state.answers.forEach((ans, i) => {
                if (ans !== null) {
                    if (ans === QUESTIONS[i].a) correct++;
                    else wrong++;
                }
            });

            const attempted = correct + wrong;
            const accuracy = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;

            $('resultsInner').innerHTML = `
                <div class="res-hero">
                    <h2>Test Completed!</h2>
                    <p style="color:var(--text-muted);font-size:14px;margin-top:2px;">Total Time: ${formatTime(state.elapsed)}</p>
                </div>
                <div class="res-score-card">
                    <div class="res-score-val">${correct} <span>/ ${QUESTIONS.length}</span></div>
                    <div class="res-score-lbl">Total Score</div>
                </div>
                <div class="res-grid">
                    <div class="res-item">
                        <div class="res-item-val" style="color:var(--green)">${correct}</div>
                        <div class="res-item-lbl">Correct</div>
                    </div>
                    <div class="res-item">
                        <div class="res-item-val" style="color:var(--red)">${wrong}</div>
                        <div class="res-item-lbl">Wrong</div>
                    </div>
                    <div class="res-item">
                        <div class="res-item-val">${attempted}</div>
                        <div class="res-item-lbl">Attempted</div>
                    </div>
                    <div class="res-item">
                        <div class="res-item-val" style="color:var(--primary)">${accuracy}%</div>
                        <div class="res-item-lbl">Accuracy</div>
                    </div>
                </div>
                <div class="res-actions">
                    <button class="res-btn primary" onclick="location.reload()"><i class="fas fa-redo"></i> Retake Test</button>
                </div>
            `;
            $('resultsScreen').classList.add('open');
        }
    </script>
</body>
</html>
